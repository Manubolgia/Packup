<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real values -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#14171A" />
    <meta
      name="description"
      content="Model your luggage in 3D and know which item is in which bag."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Packup" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <title>Packup!</title>
    <!-- Applied before first paint so a stored theme never flashes the other one.
         Kept in sync with src/app/theme.ts. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('packup.theme');
        } catch (e) {
          /* storage may be unavailable; fall through to the system preference */
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
