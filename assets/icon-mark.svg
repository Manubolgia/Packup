<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Suitcase mark, technical-drawing language: flat fills, square corners,
       one accent. Transparent ground so the maskable icon can composite it
       over flat brand colour. Keep in sync with icon-source.svg. -->
  <g transform="translate(512 512)">
    <!-- handle -->
    <path d="M -118 -300 h 236 v 52 h -60 v -0 h -116 v 0 h -60 z" fill="#F2F2F0"/>
    <path d="M -118 -300 h 52 v 60 h -52 z M 66 -300 h 52 v 60 h -52 z" fill="#F2F2F0"/>
    <!-- shell -->
    <rect x="-260" y="-240" width="520" height="424" fill="#F2F2F0"/>
    <!-- latch strip, cut as negative space in the main colour -->
    <rect x="-260" y="-52" width="520" height="44" fill="#14171A"/>
    <!-- clasp -->
    <rect x="-40" y="-76" width="80" height="92" fill="#E8A317"/>
    <!-- feet -->
    <rect x="-196" y="184" width="72" height="36" fill="#F2F2F0"/>
    <rect x="124" y="184" width="72" height="36" fill="#F2F2F0"/>
  </g>
</svg>
